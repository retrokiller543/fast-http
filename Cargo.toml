[workspace]
members = [
    ".",
    "crates/*"
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Emil Schütt <emil.schutt@gmail.com>"]
repository = "https://github.com/retrokiller543/fast-http"
keywords = ["http", "framework", "async"]
categories = ["network-programming", "asynchronous"]

[workspace.dependencies]
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
bytes = "1.12.1"
hyper = { version = "1.12.0", features = ["server"] }
hyper-util = "0.1.21"
tokio = "1.54.1"
tokio-rustls = { version = "0.26.6", features = ["ring"] }
rustls = "0.24.0-dev.2"
thiserror = "2.0.21"
tracing = "0.1.44"
pin-project-lite = "0.2.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
serde_norway = "0.9.42"
ciborium = "0.2.2"
rmp-serde = "1.3.1"
quick-xml = { version = "0.42.0", features = ["serialize"] }
toml = "1.2.1"
futures-core = "0.3.34"

[package]
name = "fast-http"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
