[workspace]
members = [
    ".",
    "crates/*"
]
exclude = ["benchmarks"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Emil Schütt <emil.schutt@gmail.com>"]
repository = "https://github.com/retrokiller543/fast-http"
keywords = ["http", "framework", "async"]
categories = ["network-programming", "asynchronous"]

[workspace.dependencies]
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
bytes = "1.12.1"
hyper = { version = "1.12.0", features = ["server"] }
hyper-util = "0.1.21"
tokio = "1.54.1"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
thiserror = "2.0.21"
tracing = "0.1.44"
pin-project-lite = "0.2.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
serde_norway = "0.9.42"
ciborium = "0.2.2"
rmp-serde = "1.3.1"
quick-xml = { version = "0.42.0", features = ["serialize"] }
toml = "1.2.1"
futures-core = "0.3.34"
criterion = "0.8.2"
bench_metrics = { package = "mhr-bench-metrics", version = "0.1" }
darwin-kperf-criterion = "0.1"
tower = { version = "0.5.3", features = ["util"] }
tower-layer = "0.3.3"
tower-service = "0.3.3"

fast-http-bench-support = { path = "crates/bench-support" }
fast-http-core = { path = "crates/core" }
fast-http-format = { path = "crates/format", default-features = false }
fast-http-layer = { path = "crates/layer" }
fast-http-router = { path = "crates/router" }
fast-http-server = { path = "crates/server" }
fast-http-transport = { path = "crates/transport" }

[package]
name = "fast-http"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
