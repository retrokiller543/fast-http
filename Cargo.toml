[workspace]
members = [
    ".",
    "crates/*"
]
exclude = ["benchmarks"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Emil Schütt <emil.schutt@gmail.com>"]
repository = "https://github.com/retrokiller543/fast-http"
keywords = ["http", "framework", "async"]
categories = ["network-programming", "asynchronous"]

[workspace.dependencies]
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
bytes = "1.12.1"
hyper = { version = "1.12.0", features = ["server"] }
hyper-util = "0.1.21"
tokio = "1.54.1"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
thiserror = "2.0.21"
tracing = "0.1.44"
pin-project-lite = "0.2.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
serde_norway = "0.9.42"
ciborium = "0.2.2"
rmp-serde = "1.3.1"
quick-xml = { version = "0.42.0", features = ["serialize"] }
toml = "1.2.1"
futures-core = "0.3.34"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
multer = { version = "3.1.0", default-features = false }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
criterion = "0.8.2"
bench_metrics = { package = "mhr-bench-metrics", version = "0.1" }
tower = { version = "0.5.3", features = ["util"] }
tower-layer = "0.3.3"
tower-service = "0.3.3"

fast-http-bench-support = { path = "crates/bench-support" }
fast-http-core = { path = "crates/core" }
fast-http-format = { path = "crates/format", default-features = false }
fast-http-layer = { path = "crates/layer" }
fast-http-macros = { path = "crates/macros" }
fast-http-multipart = { path = "crates/multipart" }
fast-http-router = { path = "crates/router" }
fast-http-server = { path = "crates/server" }
fast-http-transport = { path = "crates/transport" }
fast-http-ws = { path = "crates/ws" }

[package]
name = "fast-http"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["json"]
full = ["json", "form", "yaml", "toml", "cbor", "msgpack", "xml", "problem", "tower", "tls", "ws", "multipart", "macros"]
json = ["fast-http-format/json"]
form = ["fast-http-format/form"]
yaml = ["fast-http-format/yaml"]
toml = ["fast-http-format/toml"]
cbor = ["fast-http-format/cbor"]
msgpack = ["fast-http-format/msgpack"]
xml = ["fast-http-format/xml"]
problem = ["fast-http-format/problem"]
tower = ["fast-http-layer/tower"]
tls = ["fast-http-server/tls"]
ws = ["dep:fast-http-ws"]
multipart = ["dep:fast-http-multipart"]
macros = ["dep:fast-http-macros"]

[dependencies]
fast-http-core.workspace = true
fast-http-format.workspace = true
fast-http-layer.workspace = true
fast-http-router.workspace = true
fast-http-server.workspace = true
fast-http-transport.workspace = true
fast-http-macros = { workspace = true, optional = true }
fast-http-multipart = { workspace = true, optional = true }
fast-http-ws = { workspace = true, optional = true }

[dev-dependencies]
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
