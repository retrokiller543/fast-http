# Comparison benchmarks against other frameworks. A separate workspace with its own lockfile, so
# competitor crates and benchmark-only features never reach the fast-http crates.
[workspace]
members = ["comparison", "load"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Emil Schütt <emil.schutt@gmail.com>"]
repository = "https://github.com/retrokiller543/fast-http"
publish = false

[workspace.dependencies]
http = "1.5.0"
http-body-util = "0.1.5"
bytes = "1.12.1"
tokio = "1.54.1"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
criterion = "0.8.2"
tower = { version = "0.5.3", features = ["util"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
matchit = "0.9.2"
actix-router = "0.5.5"
actix-web = { version = "4.19.0", default-features = false }
libc = "0.2.191"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }

fast-http-bench = { path = "comparison" }
fast-http-bench-support = { path = "../crates/bench-support" }
fast-http-core = { path = "../crates/core" }
fast-http-format = { path = "../crates/format", default-features = false }
fast-http-router = { path = "../crates/router" }
fast-http-server = { path = "../crates/server" }
fast-http-transport = { path = "../crates/transport" }
